##
# Nginx reverse proxy for Zvolta Node app on port 3003
#
# Replace ADD_DOMAIN_HERE with your actual domain, for example:
#   drivers.zvolta.com
#   manual.zvolta.com
#   zvolta.com
#
# SSL certificate paths assume the default Certbot / Let's Encrypt layout:
#   /etc/letsencrypt/live/ADD_DOMAIN_HERE/fullchain.pem
#   /etc/letsencrypt/live/ADD_DOMAIN_HERE/privkey.pem
##

server {
    listen 80;
    listen [::]:80;

    server_name drivers-manual.zvolta.com;

    # Allow Certbot HTTP challenge renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all normal HTTP traffic to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name drivers-manual.zvolta.com;

    ssl_certificate /etc/letsencrypt/live/drivers-manual.zvolta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drivers-manual.zvolta.com/privkey.pem;

    # Recommended SSL settings created by Certbot.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for WebSocket / hot app connections if the app uses them.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_cache_bypass $http_upgrade;
    }
}
